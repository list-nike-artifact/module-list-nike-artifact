[package]
name = "mlnike"
version = "0.1.0"
edition = "2021"
description = "Module list-NIKE over R_q = Z_q[X]/(X^d+1), at the recommended parameter set of this submission"

[lib]
name = "mlnike"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"

[[bin]]
name = "listpos"
path = "src/bin/listpos.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
